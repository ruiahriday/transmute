name: Build Transmute

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Download ffmpeg (static, Apple Silicon + Intel)
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-dl && cd ffmpeg-dl
          for arch in arm64 amd64; do
            curl -fsSL --retry 3 -o "ffmpeg-$arch.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/ffmpeg.zip"
            mkdir -p "$arch" && unzip -q -o "ffmpeg-$arch.zip" -d "$arch"
          done
          lipo -create "$(find arm64 -type f -name ffmpeg | head -1)" "$(find amd64 -type f -name ffmpeg | head -1)" -output ffmpeg
          chmod +x ffmpeg
          lipo -info ffmpeg
          ./ffmpeg -hide_banner -version | head -1
          for enc in libx264 libvpx-vp9 libopus libvorbis libmp3lame libwebp aac flac wmv2 wmav2 mpeg4 gif pcm_s16le; do
            if ./ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $enc "; then echo "ok      $enc"; else echo "::warning::bundled ffmpeg has no $enc encoder"; fi
          done
          echo "FFMPEG_BIN=$PWD/ffmpeg" >> "$GITHUB_ENV"

      - name: Build app (universal)
        run: UNIVERSAL=1 ./build-app.sh

      - name: Check the bundle
        run: |
          set -euo pipefail
          lipo -info build/Transmute.app/Contents/MacOS/Transmute
          plutil -lint build/Transmute.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/Transmute.app

      - name: Launch test (app must stay running)
        run: |
          ./build/Transmute.app/Contents/MacOS/Transmute > launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App launched and is still running"
            kill "$PID"
          else
            echo "::error::The app quit or crashed at launch"
            cat launch.log
            exit 1
          fi

      - name: Conversion self-test (with bundled ffmpeg)
        run: |
          scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures" "$FFMPEG_BIN"
          ./build/Transmute.app/Contents/MacOS/Transmute --selftest "$RUNNER_TEMP/fixtures"

      - name: Conversion self-test (no ffmpeg, Apple-only fallbacks; informational)
        continue-on-error: true
        run: |
          TRANSMUTE_NO_FFMPEG=1 ./build/Transmute.app/Contents/MacOS/Transmute --selftest "$RUNNER_TEMP/fixtures"

      - name: Package zip and disk image
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/Transmute.app build/Transmute.zip
          mkdir -p build/dmg
          cp -R build/Transmute.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Transmute -srcfolder build/dmg -ov -format UDZO build/Transmute.dmg
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Transmute
          path: |
            build/Transmute.dmg
            build/Transmute.zip

      - name: Publish download (release "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cat > notes.md <<'NOTES'
          **Install:** open `Transmute.dmg` and drag Transmute into Applications.

          **First launch:** macOS blocks apps that aren't signed with a paid Apple developer certificate. Open Transmute once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. You only do this once.

          Works on Apple Silicon and Intel Macs with macOS 13 or newer. ffmpeg is included.
          NOTES
          gh release create latest build/Transmute.dmg build/Transmute.zip \
            --target "$GITHUB_SHA" --title "Transmute" --notes-file notes.md --latest
