name: Build Transmute

on:
  push:
    # dev is for trying changes on the Mac build server; only main publishes the download.
    # appstore holds the Mac App Store (sandboxed) variant; it never publishes anything.
    branches: [main, dev, appstore]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    # Trial runs on dev report problems as annotations without sending failure emails.
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Download ffmpeg (static, Apple Silicon + Intel)
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-dl && cd ffmpeg-dl
          for arch in arm64 amd64; do
            curl -fsSL --retry 3 -o "ffmpeg-$arch.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/ffmpeg.zip"
            mkdir -p "$arch" && unzip -q -o "ffmpeg-$arch.zip" -d "$arch"
          done
          lipo -create "$(find arm64 -type f -name ffmpeg | head -1)" "$(find amd64 -type f -name ffmpeg | head -1)" -output ffmpeg
          chmod +x ffmpeg
          lipo -info ffmpeg
          ./ffmpeg -hide_banner -version | head -1
          for enc in libx264 libvpx-vp9 libopus libvorbis libmp3lame libwebp aac flac wmv2 wmav2 mpeg4 gif pcm_s16le; do
            if ./ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $enc "; then echo "ok      $enc"; else echo "::warning::bundled ffmpeg has no $enc encoder"; fi
          done
          echo "FFMPEG_BIN=$PWD/ffmpeg" >> "$GITHUB_ENV"

      - name: Build app (universal)
        id: build
        run: |
          mkdir -p logs
          UNIVERSAL=1 BUILD_NUMBER=${{ github.run_number }} bash build-app.sh 2>&1 | tee logs/build.log

      - name: Check the bundle
        run: |
          set -euo pipefail
          lipo -info build/Transmute.app/Contents/MacOS/Transmute
          plutil -lint build/Transmute.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/Transmute.app

      - name: Launch test (app must stay running)
        id: launch
        run: |
          ./build/Transmute.app/Contents/MacOS/Transmute > logs/launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App launched and is still running"
            kill "$PID"
          else
            echo "The app quit or crashed at launch" >> logs/launch.log
            cat logs/launch.log
            exit 1
          fi

      - name: Conversion self-test (with bundled ffmpeg)
        id: selftest
        run: |
          bash scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures" "$FFMPEG_BIN" 2>&1 | tee logs/fixtures.log
          ./build/Transmute.app/Contents/MacOS/Transmute --selftest "$RUNNER_TEMP/fixtures" 2>&1 | tee logs/selftest.log

      - name: Conversion self-test (no ffmpeg, Apple-only fallbacks; informational)
        id: selftest_noff
        continue-on-error: true
        run: |
          TRANSMUTE_NO_FFMPEG=1 ./build/Transmute.app/Contents/MacOS/Transmute --selftest "$RUNNER_TEMP/fixtures" 2>&1 | tee logs/selftest-noffmpeg.log

      # Raw logs need a download; annotations can be read straight from the API.
      - name: Report results as annotations
        if: always()
        run: |
          level() { if [[ "$1" == "failure" ]]; then echo error; else echo notice; fi; }
          bash scripts/ci-report.sh "$(level '${{ steps.build.outcome }}')" "Build" logs/build.log
          bash scripts/ci-report.sh "$(level '${{ steps.launch.outcome }}')" "Launch test" logs/launch.log 40
          bash scripts/ci-report.sh "$(level '${{ steps.selftest.outcome }}')" "Fixtures" logs/fixtures.log 40
          bash scripts/ci-report.sh "$(level '${{ steps.selftest.outcome }}')" "Self-test" logs/selftest.log 400
          bash scripts/ci-report.sh warning "Self-test without ffmpeg" logs/selftest-noffmpeg.log 400

      - name: Package zip and disk image
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/Transmute.app build/Transmute.zip
          mkdir -p build/dmg
          cp -R build/Transmute.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Transmute -srcfolder build/dmg -ov -format UDZO build/Transmute.dmg
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Transmute
          path: |
            build/Transmute.dmg
            build/Transmute.zip

      - name: Publish download (release "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cat > notes.md <<'NOTES'
          **Install:** open `Transmute.dmg` and drag Transmute into Applications.

          **First launch:** macOS blocks apps that aren't signed with a paid Apple developer certificate. Open Transmute once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. You only do this once.

          Works on Apple Silicon and Intel Macs with macOS 13 or newer. ffmpeg is included.

          **This is a beta.** To report a problem or an idea, open the Transmute menu bar icon and choose **Send Feedback…**, or use https://github.com/${{ github.repository }}/issues/new?template=beta-feedback.yml
          NOTES
          gh release create latest build/Transmute.dmg build/Transmute.zip \
            --target "$GITHUB_SHA" --title "Transmute 1.0 beta (build ${{ github.run_number }})" --notes-file notes.md --latest

  # ---- Mac App Store variant (appstore branch only; never publishes) ---------------------

  # LGPL-only ffmpeg built from source (no libx264), cached on the build script's hash.
  ffmpeg-lgpl:
    if: github.ref == 'refs/heads/appstore'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached LGPL ffmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-lgpl/out
          key: ffmpeg-lgpl-macos15-${{ hashFiles('scripts/build-ffmpeg-lgpl.sh') }}

      - name: Build LGPL ffmpeg from source (arm64 + x86_64)
        id: ffbuild
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p logs
          brew install nasm pkg-config > logs/brew.log 2>&1 || true
          bash scripts/build-ffmpeg-lgpl.sh ffmpeg-lgpl 2>&1 | tee logs/ffmpeg-lgpl.log

      - name: List encoders
        id: encoders
        run: |
          mkdir -p logs
          {
            echo "cache hit: ${{ steps.cache.outputs.cache-hit }}"
            lipo -info ffmpeg-lgpl/out/ffmpeg
            ffmpeg-lgpl/out/ffmpeg -hide_banner -version | head -1
            ffmpeg-lgpl/out/ffmpeg -hide_banner -L | head -2
            for enc in h264_videotoolbox hevc_videotoolbox libx264 libvpx-vp9 libvpx libopus libvorbis libmp3lame libwebp aac aac_at flac wmv2 wmav2 mpeg4 gif png pcm_s16le; do
              if ffmpeg-lgpl/out/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $enc "; then echo "ok      $enc"; else echo "MISSING $enc"; fi
            done
          } 2>&1 | tee logs/encoders.log

      - name: Report results as annotations
        if: always()
        run: |
          level() { if [[ "$1" == "failure" ]]; then echo error; else echo notice; fi; }
          bash scripts/ci-report.sh "$(level '${{ steps.ffbuild.outcome }}')" "LGPL ffmpeg build" logs/ffmpeg-lgpl.log 120
          bash scripts/ci-report.sh "$(level '${{ steps.encoders.outcome }}')" "LGPL ffmpeg encoders" logs/encoders.log 60

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl
          path: ffmpeg-lgpl/out

  # Builds the App Store variant and runs the self-test inside the App Sandbox.
  appstore:
    needs: ffmpeg-lgpl
    if: always() && github.ref == 'refs/heads/appstore'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # TODO(rename): placeholders until the product name and bundle id are chosen.
      APPSTORE_BUNDLE_ID: com.example.transmute
      APPSTORE_NAME: Transmute
    steps:
      - uses: actions/checkout@v4

      - name: Get the LGPL ffmpeg
        id: getff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-lgpl
          path: ffmpeg-lgpl

      - name: Download ffmpeg for making test files only (not bundled)
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-dl && cd ffmpeg-dl
          curl -fsSL --retry 3 -o ffmpeg.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          unzip -q -o ffmpeg.zip -d x
          cp "$(find x -type f -name ffmpeg | head -1)" ./ffmpeg-fixtures
          chmod +x ffmpeg-fixtures

      - name: Build App Store variant (universal)
        id: build
        run: |
          mkdir -p logs
          # Artifacts lose the executable bit.
          if [[ -f ffmpeg-lgpl/ffmpeg ]]; then
            chmod +x ffmpeg-lgpl/ffmpeg
            export FFMPEG_BIN="$PWD/ffmpeg-lgpl/ffmpeg" FFMPEG_LICENSES="$PWD/ffmpeg-lgpl/LICENSES.txt"
          else
            echo "warning: no LGPL ffmpeg artifact; building without ffmpeg"
          fi
          APPSTORE=1 UNIVERSAL=1 BUILD_NUMBER=${{ github.run_number }} bash build-app.sh 2>&1 | tee logs/build.log
          echo "APP=build/appstore/$APPSTORE_NAME.app" >> "$GITHUB_ENV"

      - name: Check the bundle
        id: bundle
        run: |
          {
            set +e -x
            lipo -info "$APP/Contents/MacOS/Transmute"
            plutil -lint "$APP/Contents/Info.plist"
            plutil -lint "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :ITSAppUsesNonExemptEncryption" -c "Print :LSApplicationCategoryType" "$APP/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -d --entitlements - --xml "$APP" | plutil -p -
            if [[ -f "$APP/Contents/MacOS/ffmpeg" ]]; then
              codesign -d --entitlements - --xml "$APP/Contents/MacOS/ffmpeg" | plutil -p -
              "$APP/Contents/MacOS/ffmpeg" -hide_banner -buildconf | grep -E -- "--enable-(gpl|nonfree)" && echo "ERROR: GPL ffmpeg bundled"
            fi
            strings "$APP/Contents/MacOS/Transmute" | grep -i "brew install" && echo "ERROR: Homebrew text in the App Store binary"
            wc -l "$APP/Contents/Resources/ThirdPartyNotices.txt"
            set +x
          } > logs/bundle.log 2>&1
          cat logs/bundle.log
          ! grep -q "^ERROR" logs/bundle.log

      - name: Launch test (sandboxed; app must stay running)
        id: launch
        run: |
          "$APP/Contents/MacOS/Transmute" > logs/launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App launched and is still running"
            kill "$PID"
          else
            echo "The app quit or crashed at launch" >> logs/launch.log
            cat logs/launch.log
            exit 1
          fi
          CONTAINER="$HOME/Library/Containers/$APPSTORE_BUNDLE_ID"
          if [[ -d "$CONTAINER" ]]; then echo "container created: $CONTAINER" >> logs/launch.log; else echo "no container at $CONTAINER" >> logs/launch.log; fi

      - name: Conversion self-test inside the sandbox (informational)
        id: selftest
        continue-on-error: true
        run: |
          bash scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures" "$PWD/ffmpeg-dl/ffmpeg-fixtures" > logs/fixtures.log 2>&1
          # The sandboxed app can't read $RUNNER_TEMP. It looks in Downloads (entitlement) and
          # in its own container instead; put a copy in both.
          rm -rf "$HOME/Downloads/transmute-selftest-fixtures"
          mkdir -p "$HOME/Downloads"
          cp -R "$RUNNER_TEMP/fixtures" "$HOME/Downloads/transmute-selftest-fixtures" || echo "couldn't copy to Downloads"
          DATA="$HOME/Library/Containers/$APPSTORE_BUNDLE_ID/Data"
          if [[ -d "$DATA" ]]; then
            rm -rf "$DATA/selftest-fixtures"
            cp -R "$RUNNER_TEMP/fixtures" "$DATA/selftest-fixtures" || echo "couldn't copy into the container"
          fi
          "$APP/Contents/MacOS/Transmute" --selftest "$RUNNER_TEMP/fixtures" 2>&1 | tee logs/selftest.log

      - name: Report results as annotations
        if: always()
        run: |
          level() { if [[ "$1" == "failure" ]]; then echo error; else echo notice; fi; }
          bash scripts/ci-report.sh "$(level '${{ steps.build.outcome }}')" "App Store build" logs/build.log
          bash scripts/ci-report.sh "$(level '${{ steps.bundle.outcome }}')" "App Store bundle" logs/bundle.log 80
          bash scripts/ci-report.sh "$(level '${{ steps.launch.outcome }}')" "App Store launch test" logs/launch.log 40
          bash scripts/ci-report.sh notice "App Store fixtures" logs/fixtures.log 40
          bash scripts/ci-report.sh "$(level '${{ steps.selftest.outcome }}')" "App Store sandboxed self-test" logs/selftest.log 400
