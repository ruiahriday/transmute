name: Build Spinform

on:
  push:
    # dev is for trying changes on the Mac build server; only main publishes the download.
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    # Trial runs on dev report problems as annotations without sending failure emails.
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Download ffmpeg (static, Apple Silicon + Intel)
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-dl && cd ffmpeg-dl
          for arch in arm64 amd64; do
            curl -fsSL --retry 3 -o "ffmpeg-$arch.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/ffmpeg.zip"
            mkdir -p "$arch" && unzip -q -o "ffmpeg-$arch.zip" -d "$arch"
          done
          lipo -create "$(find arm64 -type f -name ffmpeg | head -1)" "$(find amd64 -type f -name ffmpeg | head -1)" -output ffmpeg
          chmod +x ffmpeg
          lipo -info ffmpeg
          ./ffmpeg -hide_banner -version | head -1
          for enc in libx264 libvpx-vp9 libopus libvorbis libmp3lame libwebp aac flac wmv2 wmav2 mpeg4 gif pcm_s16le; do
            if ./ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $enc "; then echo "ok      $enc"; else echo "::warning::bundled ffmpeg has no $enc encoder"; fi
          done
          echo "FFMPEG_BIN=$PWD/ffmpeg" >> "$GITHUB_ENV"

      - name: Build app (universal)
        id: build
        run: |
          mkdir -p logs
          UNIVERSAL=1 BUILD_NUMBER=${{ github.run_number }} bash build-app.sh 2>&1 | tee logs/build.log

      - name: Check the bundle
        run: |
          set -euo pipefail
          lipo -info build/Spinform.app/Contents/MacOS/Spinform
          plutil -lint build/Spinform.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/Spinform.app

      - name: Launch test (app must stay running)
        id: launch
        run: |
          ./build/Spinform.app/Contents/MacOS/Spinform > logs/launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App launched and is still running"
            kill "$PID"
          else
            echo "The app quit or crashed at launch" >> logs/launch.log
            cat logs/launch.log
            exit 1
          fi

      - name: Conversion self-test (with bundled ffmpeg)
        id: selftest
        run: |
          bash scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures" "$FFMPEG_BIN" 2>&1 | tee logs/fixtures.log
          ./build/Spinform.app/Contents/MacOS/Spinform --selftest "$RUNNER_TEMP/fixtures" 2>&1 | tee logs/selftest.log

      - name: Conversion self-test (no ffmpeg, Apple-only fallbacks; informational)
        id: selftest_noff
        continue-on-error: true
        run: |
          TRANSMUTE_NO_FFMPEG=1 ./build/Spinform.app/Contents/MacOS/Spinform --selftest "$RUNNER_TEMP/fixtures" 2>&1 | tee logs/selftest-noffmpeg.log

      - name: Window pictures (for checking the look)
        id: snapshots
        continue-on-error: true
        run: |
          ./build/Spinform.app/Contents/MacOS/Spinform --snapshots "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/snapshots" 2>&1 | tee logs/snapshots.log &
          PID=$!
          for i in $(seq 1 200); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la "$RUNNER_TEMP/snapshots" || true

      # Pictures and logs go to the mac-ci branch, which can be read without downloading artifacts.
      - name: Publish pictures and logs to the mac-ci branch
        if: always()
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci"
          git init -q && git checkout -q -b mac-ci
          cp -R "$RUNNER_TEMP/snapshots/." . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/logs/*.log . 2>/dev/null || true
          git add -A
          git -c user.name="build server" -c user.email="actions@github.com" commit -q -m "Mac build ${{ github.run_number }} (${{ github.ref_name }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mac-ci

      # Raw logs need a download; annotations can be read straight from the API.
      - name: Report results as annotations
        if: always()
        run: |
          level() { if [[ "$1" == "failure" ]]; then echo error; else echo notice; fi; }
          bash scripts/ci-report.sh "$(level '${{ steps.build.outcome }}')" "Build" logs/build.log
          bash scripts/ci-report.sh "$(level '${{ steps.launch.outcome }}')" "Launch test" logs/launch.log 40
          bash scripts/ci-report.sh "$(level '${{ steps.selftest.outcome }}')" "Fixtures" logs/fixtures.log 40
          bash scripts/ci-report.sh "$(level '${{ steps.selftest.outcome }}')" "Self-test" logs/selftest.log 400
          bash scripts/ci-report.sh warning "Self-test without ffmpeg" logs/selftest-noffmpeg.log 400

      - name: Package zip and disk image
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/Spinform.app build/Spinform.zip
          mkdir -p build/dmg
          cp -R build/Spinform.app build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners; try a few times.
          for attempt in 1 2 3 4; do
            if hdiutil create -volname Spinform -srcfolder build/dmg -ov -format UDZO build/Spinform.dmg; then break; fi
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 10))
          done
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Spinform
          path: |
            build/Spinform.dmg
            build/Spinform.zip

      - name: Publish download (release "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cat > notes.md <<'NOTES'
          **Spinform** (formerly Transmute) converts, compresses and edits images, video, audio, PDFs, documents and more. Drop files in the window, or hold a key while dragging to spin up the drag wheel.

          **Install:** open `Spinform.dmg` and drag Spinform into Applications. If you had Transmute installed, delete it; Spinform keeps your settings.

          **First launch:** macOS blocks apps that aren't signed with a paid Apple developer certificate. Open Spinform once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. You only do this once.

          Works on Apple Silicon and Intel Macs with macOS 13 or newer. ffmpeg is included.

          **This is a beta.** To report a problem or an idea, open the Spinform menu bar icon and choose **Send Feedback…**, or use https://github.com/${{ github.repository }}/issues/new?template=beta-feedback.yml
          NOTES
          gh release create latest build/Spinform.dmg build/Spinform.zip \
            --target "$GITHUB_SHA" --title "Spinform 1.0 beta (build ${{ github.run_number }})" --notes-file notes.md --latest
