name: Deploy the link service

# Puts server/links (the service behind "Create link") on Cloudflare. Needs the repository
# secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and SPINFORM_LINK_TOKEN (setup steps in
# server/links/README.md); until they're set it does nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/links/**", ".github/workflows/deploy-links.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/links
    steps:
      - uses: actions/checkout@v4

      - name: Test the service locally first
        run: |
          set -euo pipefail
          printf 'UPLOAD_TOKENS=test-token,other\n' > .dev.vars
          npx -y wrangler@4.153.0 dev --local --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8787/ >/dev/null && break; sleep 2; done
          SERVICE=http://127.0.0.1:8787 node test/run.mjs
          rm .dev.vars

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINK_TOKEN: ${{ secrets.SPINFORM_LINK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$LINK_TOKEN" ]]; then
            echo "::notice title=Link service::Cloudflare isn't set up yet (see server/links/README.md), so nothing was deployed."
            exit 0
          fi
          # Pasted secrets often carry a stray space or line break.
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"')
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]"')
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID::This secret should be 32 letters and digits (0-9, a-f). It is ${#CLOUDFLARE_ACCOUNT_ID} characters long; copy it again from Cloudflare."
            exit 1
          fi
          # Each step's output is also sent as an annotation when it fails (raw logs need a download).
          run() {
            local title="$1"; shift
            if ! "$@" > "$RUNNER_TEMP/step.log" 2>&1; then
              cat "$RUNNER_TEMP/step.log"
              msg=$(grep -v '^\s*$' "$RUNNER_TEMP/step.log" | grep -vi 'proxy\|update available\|^ *⛅\|^─' | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$title::$msg"
              return 1
            fi
            cat "$RUNNER_TEMP/step.log"
          }
          W="npx -y wrangler@4.153.0"
          # The bucket and its clean-up rules; "already exists" is fine on later runs.
          $W r2 bucket create spinform-links > "$RUNNER_TEMP/bucket.log" 2>&1 || {
            cat "$RUNNER_TEMP/bucket.log"
            grep -qi "already exists" "$RUNNER_TEMP/bucket.log" || run "Create the R2 bucket" $W r2 bucket create spinform-links
          }
          run "Bucket clean-up rule (links)" $W r2 bucket lifecycle add spinform-links backstop links/ --expire-days 8 --abort-multipart-days 2 -y || true
          run "Bucket clean-up rule (quotas)" $W r2 bucket lifecycle add spinform-links quotas quota/ --expire-days 3 -y || true
          run "Deploy" $W deploy
          cp "$RUNNER_TEMP/step.log" "$RUNNER_TEMP/deploy.log"
          printf '%s' "$LINK_TOKEN" > "$RUNNER_TEMP/token"
          run "App token" sh -c "$W secret put UPLOAD_TOKENS < '$RUNNER_TEMP/token'"
          rm -f "$RUNNER_TEMP/token"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          echo "::notice title=Link service address::${url:-see the Deploy step log}"
          echo "### Link service address: ${url:-see the Deploy step log}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$url" ]]; then curl -fsS "$url/" > /dev/null && echo "The service answers at $url"; fi
